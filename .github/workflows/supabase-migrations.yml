name: Supabase Migrations CI

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: # Permite ejecutar el workflow manualmente con un clic en GitHub Actions

jobs:
  apply_migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Apply Migrations to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e '
            import fs from "fs";
            import path from "path";
            import { createClient } from "@supabase/supabase-js";

            const supabaseUrl = process.env.SUPABASE_URL;
            const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;

            if (!supabaseUrl || !serviceKey) {
              console.error("Faltan variables SUPABASE_URL o SUPABASE_SERVICE_ROLE_KEY en GitHub Secrets");
              process.exit(1);
            }

            console.log("Conectando con Supabase:", supabaseUrl);
            const supabase = createClient(supabaseUrl, serviceKey);

            // Verificar conexión
            const { data, error } = await supabase.from("companies").select("id").limit(1);
            if (error && !error.message.includes("relation \"public.companies\" does not exist")) {
              console.log("Info/Estado inicial:", error.message);
            }
            console.log("Verificación de conexión exitosa con Supabase.");
          '
